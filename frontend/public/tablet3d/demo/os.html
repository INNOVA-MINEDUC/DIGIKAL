<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Inicio</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0d14;
    color: #fff;
    font: 26px/1.35 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ---------- fondo de pantalla ---------- */
  #fondo {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(90% 60% at 20% 0%, #3a5f9e 0%, transparent 55%),
      radial-gradient(80% 55% at 90% 15%, #6b4d97 0%, transparent 55%),
      linear-gradient(165deg, #24304a 0%, #131a28 55%, #090c13 100%);
    background-size: cover;
    background-position: center;
    transition: background-image .35s;
  }
  #velo {                                  /* oscurece un poco la foto para que se lean los iconos */
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.12) 40%, rgba(0,0,0,.45));
    opacity: 0;
    transition: opacity .35s;
  }
  #fondo.foto ~ #velo { opacity: 1; }

  /* ---------- barra de estado ---------- */
  #estado {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 74px;
    padding: 0 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: .01em;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
    z-index: 3;
  }
  #estado .der { display: flex; align-items: center; gap: 14px; opacity: .95; }
  #pila {
    width: 42px; height: 21px;
    border: 2.5px solid rgba(255,255,255,.85);
    border-radius: 6px;
    position: relative;
    padding: 2px;
  }
  #pila::after {
    content: "";
    position: absolute;
    right: -7px; top: 5px;
    width: 4px; height: 7px;
    background: rgba(255,255,255,.85);
    border-radius: 0 2px 2px 0;
  }
  #pila i { display: block; height: 100%; width: 78%; background: #fff; border-radius: 2px; }

  /* ---------- escritorio ---------- */
  #inicio {
    position: fixed;
    inset: 74px 0 0;
    padding: 30px 40px 50px;
    overflow-y: auto;
    z-index: 2;
  }
  #rejilla {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 34px 26px;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .app .tapa {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 26%;
    display: grid;
    place-items: center;
    box-shadow: 0 14px 30px rgba(0, 0, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .28);
    transition: transform .16s cubic-bezier(.3,.9,.3,1);
    position: relative;
    overflow: hidden;
  }
  .app .tapa::after {                       /* brillo diagonal, como los iconos de verdad */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%);
  }
  .app:active .tapa { transform: scale(.92); }
  .app svg { width: 46%; height: 46%; position: relative; z-index: 1; }
  .app .nombre {
    font-size: 21px;
    font-weight: 500;
    text-align: center;
    line-height: 1.25;
    max-width: 100%;
    text-shadow: 0 2px 6px rgba(0, 0, 0, .75);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .t-panel { background: linear-gradient(150deg, #5b9bff, #1e4fd8); }
  .t-notas { background: linear-gradient(150deg, #ffd776, #eb9a1f); }
  .t-reloj { background: linear-gradient(150deg, #33405c, #0d1420); }
  .t-pdf   { background: linear-gradient(150deg, #ff8172, #d0271c); }
  .t-web   { background: linear-gradient(150deg, #63e3c4, #0d9c88); }
  .t-guia  { background: linear-gradient(150deg, #6ba1ff, #1a3fb8); }
  .t-est   { background: linear-gradient(150deg, #4ade9f, #0a7350); }
  .t-lin   { background: linear-gradient(150deg, #b79cfb, #5b21b6); }
  .t-ver   { background: linear-gradient(150deg, #46dcf0, #0e7490); }
  .t-faq   { background: linear-gradient(150deg, #fcc95a, #b45309); }
  .t-nav   { background: linear-gradient(150deg, #f77fc0, #9d1458); }

  #vacio {
    grid-column: 1 / -1;
    padding: 60px 20px;
    text-align: center;
    color: rgba(255, 255, 255, .6);
    font-size: 24px;
  }

  /* ---------- ventana de aplicacion ---------- */
  #ventana {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: #0b0e14;
    overflow: hidden;
    will-change: transform, opacity;
  }
  #ventana[hidden] { display: none; }
  #ventana iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  #barrita {                               /* barra de inicio, como la de las tabletas */
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    width: 190px;
    height: 30px;
    z-index: 6;
    display: none;
    place-items: center;
    cursor: pointer;
  }
  #barrita::after {
    content: "";
    width: 100%;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .45);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .25);
  }
  #ventana:not([hidden]) ~ #barrita { display: grid; }
</style>
</head>
<body>

<div id="fondo"></div>
<div id="velo"></div>

<div id="estado">
  <span id="hora">--:--</span>
  <span class="der">
    <span id="titulo"></span>
    Wi-Fi
    <span id="pila"><i></i></span>
  </span>
</div>

<div id="inicio"><div id="rejilla"></div></div>

<div id="ventana" hidden></div>
<div id="barrita" title="Inicio"></div>

<script>
const $ = s => document.querySelector(s);
const fondo = $('#fondo'), rejilla = $('#rejilla'), inicio = $('#inicio'),
      ventana = $('#ventana'), titulo = $('#titulo');

const CLAVE_FONDO = 'tablet3d.fondo';
const arriba = msg => { try { parent.postMessage(msg, '*'); } catch (e) {} };

/* ====================== iconos ====================== */
const ICO = {
  panel: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">
    <path d="M4 20V13M9.3 20V5M14.7 20v-9M20 20V8"/></svg>`,
  notas: `<svg viewBox="0 0 24 24" fill="none" stroke="#4a3208" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>`,
  reloj: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="8.4"/><path d="M12 7v5.2l3.2 2"/></svg>`,
  pdf:   `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 2.5h7l4.5 4.5v14.5h-11.5z"/><path d="M13.5 2.5V7H18"/>
    <path d="M9 12.5h6M9 16h6"/></svg>`,
  web:   `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
    <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.3 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.3-3.6-8.5S9.6 5.9 12 3.5z"/></svg>`
};

Object.assign(ICO, {
  guia: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2.5" width="16" height="19" rx="2.4"/><path d="M8.4 12.4l2.4 2.4 4.8-4.8"/></svg>`,
  est: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.6l7.6 2.8v6.2c0 4.7-3.2 7.8-7.6 9.2-4.4-1.4-7.6-4.5-7.6-9.2V5.4z"/>
    <path d="M8.7 12l2.3 2.3 4.4-4.4"/></svg>`,
  lin: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <path d="M9.5 6h10M9.5 12h10M9.5 18h10"/><circle cx="5" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/></svg>`,
  ver: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 4.2H6.6v17h10.8v-17H15"/><rect x="9" y="2.5" width="6" height="3.4" rx="1"/>
    <path d="M9.2 13l2.2 2.2 4.2-4.4"/></svg>`,
  faq: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9.4 9.3a2.7 2.7 0 1 1 3.5 2.6c-.6.2-1 .8-1 1.5v.4"/>
    <circle cx="11.9" cy="17" r=".2" stroke-width="2.4"/></svg>`,
  nav: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.6"/><path d="M15.6 8.4l-2.2 5-5 2.2 2.2-5z"/></svg>`
});

const APPS = [
  { id: 'guia',  nombre: 'Guía de compra',  url: 'guia.html',         clase: 't-guia',  ico: ICO.guia },
  { id: 'est',   nombre: 'Antes de comprar', url: 'estandares.html',  clase: 't-est',   ico: ICO.est },
  { id: 'lin',   nombre: 'Lineamientos',    url: 'lineamientos.html', clase: 't-lin',   ico: ICO.lin },
  { id: 'ver',   nombre: 'Verificación',    url: 'verificacion.html', clase: 't-ver',   ico: ICO.ver },
  { id: 'faq',   nombre: 'Preguntas',       url: 'faq.html',          clase: 't-faq',   ico: ICO.faq },
  { id: 'nav',   nombre: 'Sitios permitidos', url: 'navegacion.html', clase: 't-nav',   ico: ICO.nav },
  { id: 'panel', nombre: 'Panel',  url: 'dashboard.html', clase: 't-panel', ico: ICO.panel },
  { id: 'notas', nombre: 'Notas',  url: 'notas.html',     clase: 't-notas', ico: ICO.notas },
  { id: 'reloj', nombre: 'Reloj',  url: 'reloj.html',     clase: 't-reloj', ico: ICO.reloj }
];

function pintarRejilla() {
  rejilla.innerHTML = '';
  for (const app of APPS) {
    const el = document.createElement('div');
    el.className = 'app';
    el.innerHTML = `<div class="tapa ${app.clase}">${app.ico}</div><div class="nombre"></div>`;
    el.querySelector('.nombre').textContent = app.nombre;
    el.onclick = () => encolar(() => abrir(app, el));
    rejilla.appendChild(el);
  }
}
pintarRejilla();

/* ====================== los PDF de la carpeta, como aplicaciones ======================
   La lista la manda la tableta: ya la ha leido para su propio panel y no tiene
   sentido pedir el indice de la carpeta dos veces. */
function ponerPdfs(nombres) {
  for (let i = APPS.length - 1; i >= 0; i--) if (APPS[i].pdf) APPS.splice(i, 1);

  for (const n of nombres) {
    APPS.push({
      id: 'pdf:' + n,
      nombre: n.replace(/\.pdf$/i, ''),
      url: 'pdf.html?file=' + encodeURIComponent('../pdfs/' + n) + '&name=' + encodeURIComponent(n),
      clase: 't-pdf', ico: ICO.pdf, pdf: true
    });
  }
  pintarRejilla();
}

/* ====================== abrir y cerrar con animacion ====================== */
let abierta = null;
let cola = Promise.resolve();                        // abrir/cerrar en orden, sin solaparse
const encolar = fn => (cola = cola.then(fn).catch(() => {}));

function urlSegura(valor) {
  try {
    const u = new URL(String(valor || ''), location.href);
    if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
  } catch (e) {}
  return 'about:blank';
}

function nuevoMarco(app) {
  ventana.innerHTML = '';
  const marco = document.createElement('iframe');
  if (app.html !== undefined) marco.srcdoc = app.html;
  else marco.src = urlSegura(app.url);
  ventana.appendChild(marco);
  return marco;
}

async function abrir(app, tile) {
  const primera = !abierta;
  abierta = app;
  titulo.textContent = app.nombre || '';

  const marco = nuevoMarco(app);
  if (app.datos) marco.addEventListener('load', () =>
    marco.contentWindow.postMessage({ type: 'pdf-data', data: app.datos, name: app.nombre }, '*'), { once: true });

  arriba({ t: 'os-abierto', nombre: app.nombre || '', pdf: !!app.pdf || !!app.datos });

  if (!primera) {                                  // ya habia una app: cambio suave
    ventana.animate([{ opacity: .35 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
    return;
  }

  ventana.hidden = false;

  // la ventana crece desde el icono que se ha tocado
  const r = tile ? tile.querySelector('.tapa').getBoundingClientRect()
                 : { left: innerWidth / 2 - 90, top: innerHeight / 2 - 90, width: 180, height: 180 };
  const escala = r.width / innerWidth;
  const dx = r.left + r.width / 2 - innerWidth / 2;
  const dy = r.top + r.height / 2 - innerHeight / 2;

  const a = ventana.animate([
    { transform: `translate(${dx}px, ${dy}px) scale(${escala})`, opacity: 0, borderRadius: '90px' },
    { transform: 'translate(0px, 0px) scale(1)', opacity: 1, borderRadius: '0px' }
  ], { duration: 430, easing: 'cubic-bezier(.22,.85,.25,1)', fill: 'both' });

  inicio.animate([
    { transform: 'scale(1)', opacity: 1, filter: 'blur(0px)' },
    { transform: 'scale(1.14)', opacity: 0, filter: 'blur(7px)' }
  ], { duration: 430, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' });

  await a.finished;
  if (abierta === app) inicio.style.visibility = 'hidden';
}

async function cerrar() {
  if (!abierta) return;

  const app = abierta;
  abierta = null;
  titulo.textContent = '';
  inicio.style.visibility = '';

  const tile = [...rejilla.children][APPS.findIndex(a => a.id === app.id)];
  const r = tile ? tile.querySelector('.tapa').getBoundingClientRect()
                 : { left: innerWidth / 2 - 90, top: innerHeight / 2 - 90, width: 180, height: 180 };
  const escala = r.width / innerWidth;
  const dx = r.left + r.width / 2 - innerWidth / 2;
  const dy = r.top + r.height / 2 - innerHeight / 2;

  const a = ventana.animate([
    { transform: 'translate(0px, 0px) scale(1)', opacity: 1, borderRadius: '0px' },
    { transform: `translate(${dx}px, ${dy}px) scale(${escala})`, opacity: 0, borderRadius: '90px' }
  ], { duration: 380, easing: 'cubic-bezier(.35,0,.2,1)', fill: 'both' });

  inicio.animate([
    { transform: 'scale(1.14)', opacity: 0, filter: 'blur(7px)' },
    { transform: 'scale(1)', opacity: 1, filter: 'blur(0px)' }
  ], { duration: 380, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'both' });

  await a.finished;
  ventana.hidden = true;
  ventana.innerHTML = '';                          // libera la aplicacion
  arriba({ t: 'os-inicio' });
}

$('#barrita').onclick = () => encolar(cerrar);

/* ====================== fondo de pantalla ====================== */
function ponerFondo(src, guardar = true) {
  if (src) {
    fondo.style.backgroundImage = /^linear-gradient|^radial-gradient/.test(src) ? src : `url("${src}")`;
    fondo.classList.toggle('foto', !/^linear-gradient|^radial-gradient/.test(src));
  } else {
    fondo.style.backgroundImage = '';
    fondo.classList.remove('foto');
  }
  if (!guardar) return;
  try { src ? localStorage.setItem(CLAVE_FONDO, src) : localStorage.removeItem(CLAVE_FONDO); }
  catch (e) { arriba({ t: 'os-aviso', texto: 'El fondo es demasiado grande para recordarlo' }); }
}

/* Fondo por defecto de la pantalla de inicio. Se aplica con ponerFondo() y no
   como CSS de #fondo para que también active la clase .foto, que es la que
   enciende el velo que oscurece la imagen y deja legibles los iconos.
   Va con guardar=false: es el valor de partida, no una elección del usuario,
   así que no se escribe en localStorage y quien elija otro fondo lo conserva. */
const FONDO_POR_DEFECTO = '../imgs/fondo_front2.jpg';

try {
  const guardado = localStorage.getItem(CLAVE_FONDO);
  ponerFondo(guardado || FONDO_POR_DEFECTO, false);
} catch (e) {
  ponerFondo(FONDO_POR_DEFECTO, false);   // navegador sin localStorage disponible
}

/* ====================== ordenes desde la tableta ====================== */
addEventListener('message', e => {
  const m = e.data;
  if (!m || typeof m !== 'object') return;

  // lo que venga de la aplicacion de dentro se reenvia hacia arriba
  const marco = ventana.querySelector('iframe');
  if (marco && e.source === marco.contentWindow) { arriba(m); return; }

  if (m.type && String(m.type).startsWith('pdf-')) {        // ordenes para el visor de PDF
    if (marco) marco.contentWindow.postMessage(m, '*');
    return;
  }

  switch (m.t) {
    case 'abrir':
      encolar(() => abrir({ id: m.id || 'ext', nombre: m.nombre || '', url: m.url, pdf: !!m.pdf },
                          [...rejilla.children][APPS.findIndex(a => a.id === m.id)]));
      break;
    case 'abrirHtml':
      encolar(() => abrir({ id: 'html', nombre: m.nombre || 'HTML', html: m.html }));
      break;
    case 'abrirDatos':
      encolar(() => abrir({ id: 'pdfdatos', nombre: m.nombre || 'PDF', url: 'pdf.html', datos: m.datos, pdf: true }));
      break;
    case 'inicio': encolar(cerrar); break;
    case 'fondo':  ponerFondo(m.src); break;
    case 'scroll':                                   // la rueda del raton sobre el cristal
      if (marco) marco.contentWindow.scrollBy({ top: m.dy, behavior: 'instant' });
      break;
    // case 'pdfs':   ponerPdfs(m.nombres || []); break;
  }
});

/* ====================== reloj de la barra ====================== */
function hora() {
  const d = new Date();
  $('#hora').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
hora();
setInterval(hora, 10000);

arriba({ t: 'os-listo' });
</script>
</body>
</html>
