server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # GZIP
    gzip on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        # Faltaban: el sitemap y el manifiesto se servían sin comprimir, y los
        # SVG y las fuentes son de los archivos que más se benefician.
        image/svg+xml
        application/manifest+json
        font/woff
        font/ttf;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA Vue Router History Mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos. Se añade webp, que es el formato en el que se sirven
    # ahora todas las imágenes y quedaba fuera de la caché de un año.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt y sitemap.xml: caché corta, para poder corregirlos sin esperar
    # un año a que caduque en los rastreadores.
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # El index NO se cachea: es lo que apunta a los bundles con hash, y si se
    # queda pegado el navegador sigue pidiendo versiones que ya no existen.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
    }
}