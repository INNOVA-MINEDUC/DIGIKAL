name: Frontend Docker CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "frontend/**"
      - "!frontend/**/*.md"
      - "!frontend/.gitignore"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  analisis-estatico:
    name: Análisis de Código (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar y Ejecutar Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config="p/default" --sarif -o semgrep.sarif || true

      - name: Subir Reporte Semgrep a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  build-and-push:
    needs: analisis-estatico
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Determina el ambiente según la rama que disparó el workflow
      - name: Set environment config
        id: config
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "API_URL=${{ secrets.VITE_API_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=development" >> $GITHUB_OUTPUT
            echo "API_URL=${{ secrets.VITE_API_URL_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate custom identifiers
        id: vars
        run: |
          echo "TS=$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag por ambiente (ej: production-latest, development-latest)
            type=raw,value=${{ steps.config.outputs.ENV_NAME }}-latest

            # Tag detallado con timestamp y SHA
            type=raw,value=${{ steps.config.outputs.ENV_NAME }}-${{ steps.vars.outputs.TS }}-${{ steps.vars.outputs.SHORT_SHA }}

            # Tag estándar por Git SHA
            type=sha,format=short

      # La URL del API viaja como build-arg, NO como archivo .env.production.
      # El dockerfile declara `ENV VITE_API_URL=$VITE_API_URL`: si el build-arg
      # no se pasa, esa variable queda como cadena VACÍA en el entorno del
      # build y Vite le da prioridad sobre cualquier .env, así que el bundle
      # salía apuntando al valor por defecto de helpers/api.js
      # (http://localhost:3000). Por eso el frontend desplegado pedía
      # http://localhost:3000 desde https://digikal.mineduc.edu.gt.
      - name: Verificar que la URL del API está configurada
        run: |
          if [ -z "${{ steps.config.outputs.API_URL }}" ]; then
            echo "::error::Falta el secret VITE_API_URL_PROD / VITE_API_URL_DEV. Sin él el bundle apunta a http://localhost:3000."
            exit 1
          fi

      - name: Construir imagen local para escaneo
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          load: true
          build-args: |
            VITE_API_URL=${{ steps.config.outputs.API_URL }}
          tags: local-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ejecutar Trivy (Generar Reporte de Auditoría)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Aquí no ponemos exit-code para asegurar que genere el reporte completo

      - name: Subir Reporte Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Ejecutar Trivy (Control de Calidad - Bloqueo)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ steps.config.outputs.API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Workflow Summary
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente:** ${{ steps.config.outputs.ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.config.outputs.ENV_NAME }}-${{ steps.vars.outputs.TS }}-${{ steps.vars.outputs.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy to Development Server
    needs: build-and-push
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    concurrency: deploy-development
    permissions:
      contents: read
      packages: read

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          script: |
            set -e
            cd /opt/public_html/DIGIKAL
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -a -f

  deploy-prod:
    name: Deploy to Production Server
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          script: |
            set -e
            cd /opt/public_html/DIGIKAL
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -a -f
