services:
  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Las variables (incluido JWT_SECRET) salen del .env del backend. Antes solo
    # se pasaba NODE_ENV: si el contenedor se levantaba sin montar el volumen,
    # no había JWT_SECRET y el código firmaba los tokens con la palabra
    # "secret". Ahora config/env.js aborta el arranque si falta.
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    # Credenciales desde el .env de la raíz (ver .env.example). Estaban escritas
    # aquí como root/root, y este archivo sí va al repositorio.
    # La sintaxis :? hace que `docker compose up` falle si la variable no existe.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD en el .env de la raíz}
      MYSQL_DATABASE: ${DB_NAME:-innova_spa}
      MYSQL_USER: ${DB_USER:?defina DB_USER en el .env de la raíz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el .env de la raíz}
    # SIN bloque `ports`. Antes publicaba 3307:3306 con la contraseña root/root:
    # en un servidor con IP pública eso entrega la base entera con una
    # credencial de diccionario. El backend la alcanza por la red interna de
    # Docker usando DB_HOST=db.
    #
    # Para conectarse con un cliente desde esta máquina, descomente la línea de
    # abajo: el 127.0.0.1 evita que el puerto quede expuesto en todas las
    # interfaces de red.
    # ports:
    #   - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
